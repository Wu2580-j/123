<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 · 奶娃 风格</title>
    <meta name="description" content="奶娃 的个人主页 —— 全栈开发者 · 开源爱好者 · 终身学习者">
    <meta name="theme-color" content="#0F0F1A">
    <meta property="og:title" content="奶娃 的个人主页">
    <meta property="og:description" content="全栈开发者 · 开源爱好者 · 终身学习者">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- 背景图轮播（放在最底层） -->
    <div class="bg-slideshow">
        <div class="bg-slide active">
            <div class="bg-slide-blur" style="background-image: url('assets/images/bg/1.webp')"></div>
            <div class="bg-slide-sharp" style="background-image: url('assets/images/bg/1.webp')"></div>
        </div>
        <div class="bg-slide">
            <div class="bg-slide-blur" style="background-image: url('assets/images/bg/2.webp')"></div>
            <div class="bg-slide-sharp" style="background-image: url('assets/images/bg/2.webp')"></div>
        </div>
        <div class="bg-slide">
            <div class="bg-slide-blur" style="background-image: url('assets/images/bg/3.webp')"></div>
            <div class="bg-slide-sharp" style="background-image: url('assets/images/bg/3.webp')"></div>
        </div>
    </div>

    <!-- 深色遮罩 -->
    <div class="bg-overlay"></div>

    <!-- 动态光晕 -->
    <div class="bg-animation"></div>

    <!-- 粒子 -->
    <div class="particles" id="particles"></div>

    <div class="container">

        <!-- 头像区域 -->
        <section class="avatar-section">
            <div class="avatar-wrapper">
                <div class="avatar"><img src="assets/images/icons/11.png" alt="奶娃的头像"></div>
                <div class="avatar-ring"></div>
            </div>
            <h1 class="name">奶娃</h1>
            <p class="tagline">全栈开发者 · 开源爱好者 · 终身学习者</p>
            <div class="social-links">
                <a href="#" class="social-link" title="GitHub">
                    <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1。
                <a href="#" class="social-link" title="Twitter">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
                <a href="#" class="social-link" title="Email">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </a>
            </div>
        </section>

        <!-- 常用网站链接 -->
        <section class="links-section">
            <h2 class="section-title">常用网站</h2>
            <div class="links-grid" id="linksGrid"></div>
        </section>

    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>© 2026 奶娃 · 灵感来源于 <a href="https://www.leleo.top" target="_blank">leleo.top</a></p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
