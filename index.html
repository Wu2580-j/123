<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林墨 · 作品集</title>
  <style>
    /* ===== 全局重置与变量 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f9fafc;
      --card: #ffffff;
      --text-primary: #1e2b3c;
      --text-secondary: #4a5b6e;
      --accent: #3a7bd5;
      --accent-light: #e9f0fe;
      --accent-dark: #2563c4;
      --border-light: #eef2f6;
      --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.02);
      --shadow-hover: 0 20px 30px -10px rgba(0, 20, 40, 0.1);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: all 0.25s ease;
    }

    /* ===== 背景拼图容器（桌面端） ===== */
    .bg-collage {
      position: fixed;
      inset: 0;
      z-index: -2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .bg-collage .bg-piece {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 四张背景图路径 */
    .bg-piece:nth-child(1) { background-image: url('assets/images/bg/1.jpg'); }
    .bg-piece:nth-child(2) { background-image: url('assets/images/bg/2.jpg'); }
    .bg-piece:nth-child(3) { background-image: url('assets/images/bg/3.jpg'); }
    .bg-piece:nth-child(4) { background-image: url('assets/images/bg/4.jpg'); }

    /* 背景遮罩：让文字清晰，但保留图片可见度 */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(10, 20, 35, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft Yahei', sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      background-color: #0a1423; /* 移动端若图片加载失败，有深色底色 */
    }

    /* ===== 悬浮面板（桌面端右上角） ===== */
    .main-card {
      position: fixed;
      top: 2rem;
      right: 2rem;
      width: 380px;
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 2rem 1.8rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      z-index: 10;
      transition: var(--transition);
    }

    .main-card::-webkit-scrollbar {
      width: 4px;
    }
    .main-card::-webkit-scrollbar-track {
      background: transparent;
    }
    .main-card::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }

    /* ===== 头部区域 ===== */
    .profile-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .avatar-wrapper {
      flex-shrink: 0;
      width: 70px;
      height: 70px;
      border-radius: 32%;
      background: linear-gradient(135deg, #3a7bd5, #8ca9e0);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      font-weight: 500;
      box-shadow: 0 12px 18px -8px rgba(58, 123, 213, 0.3);
      transition: var(--transition);
      cursor: pointer;
      opacity: 0.92;
    }

    .avatar-wrapper:hover {
      transform: scale(1.02);
      border-radius: 40%;
      opacity: 1;
    }

    .intro {
      flex: 1;
    }

    .intro .greeting {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .intro h1 {
      font-size: 1.8rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #0f1a2c;
      margin-bottom: 0.3rem;
    }

    .intro .tagline {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.8rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .contact-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.3rem 0.7rem;
      background: rgba(249, 250, 252, 0.7);
      border-radius: 40px;
      border: 1px solid var(--border-light);
      transition: var(--transition);
      font-weight: 500;
      opacity: 0.9;
    }

    .contact-links a:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: transparent;
      transform: translateY(-2px);
      opacity: 1;
    }

    /* ===== 技能标签 ===== */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.6rem;
      margin: 1rem 0 1.2rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(238, 242, 246, 0.6);
    }

    .skill-tag {
      background: rgba(242, 245, 249, 0.75);
      color: #2c3e50;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: var(--transition);
      border: 1px solid transparent;
      opacity: 0.88;
    }

    .skill-tag:hover {
      background: white;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 6px 14px rgba(58, 123, 213, 0.12);
      transform: translateY(-2px);
      opacity: 1;
    }

    /* ===== 页脚 ===== */
    .footer-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #8a9aa9;
      letter-spacing: 0.2px;
      border-top: 1px solid rgba(238, 242, 246, 0.6);
      padding-top: 1.2rem;
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    /* ===== 响应式：手机端流式布局 ===== */
    @media (max-width: 768px) {
      .bg-collage {
        display: none; /* 隐藏拼图 */
      }

      body {
        padding: 1rem 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-attachment: scroll;
        /* 移动端随机背景由 JS 动态设置 */
      }

      .main-card {
        position: relative;
        top: 0;
        right: 0;
        width: 100%;
        max-height: none;
        overflow-y: visible;
        border-radius: 24px;
        margin: 0 auto;
        padding: 1.8rem 1.25rem 2.2rem;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .avatar-wrapper {
        width: 80px;
        height: 80px;
        font-size: 2rem;
        border-radius: 28%;
      }

      .intro h1 {
        font-size: 2.1rem;
      }

      .intro .tagline {
        font-size: 1rem;
      }

      .skill-tag {
        padding: 0.45rem 1rem;
        font-size: 0.85rem;
      }
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(238, 242, 246, 0.5);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a0b3c9;
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ===== 桌面端拼图背景 ===== -->
  <div class="bg-collage" aria-hidden="true">
    <div class="bg-piece"></div>
    <div class="bg-piece"></div>
    <div class="bg-piece"></div>
    <div class="bg-piece"></div>
  </div>

  <!-- 背景遮罩 -->
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- ===== 悬浮面板 ===== -->
  <div class="main-card fade-in">

    <!-- 头部 -->
    <div class="profile-header">
      <div class="avatar-wrapper" aria-label="头像，显示名字缩写" tabindex="0">
        <span>LM</span>
      </div>
      <div class="intro">
        <div class="greeting">✦ 创意开发者</div>
        <h1>林 墨</h1>
        <p class="tagline">
          热爱构建简洁、优雅且富有交互感的数字体验。<br>
          专注于前端开发与设计，追求代码与美学的平衡。
        </p>
        <div class="contact-links">
          <a href="#" title="电子邮箱">✉️ hello@linmo.design</a>
          <a href="#" title="GitHub">🐙 github.com/linmo</a>
          <a href="#" title="作品集站点">🔗 个人作品集</a>
        </div>
      </div>
    </div>

    <!-- 技能标签 -->
    <div class="skills" aria-label="技能标签">
      <span class="skill-tag">HTML5</span>
      <span class="skill-tag">CSS3</span>
      <span class="skill-tag">JavaScript</span>
      <span class="skill-tag">React</span>
      <span class="skill-tag">Vue</span>
      <span class="skill-tag">Figma</span>
      <span class="skill-tag">UI/UX</span>
      <span class="skill-tag">响应式设计</span>
      <span class="skill-tag">交互动效</span>
    </div>

    <!-- 页脚 -->
    <div class="footer-note">
      <p>© 2025 林墨 · 用心设计 & 编码 · <a href="#">下载简历</a></p>
    </div>
  </div>

  <script>
    (function() {
      console.log("✨ 林墨 · 作品集已加载");

      // ===== 移动端随机背景 =====
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      
      if (isMobile) {
        // 四张背景图的路径（请确保图片存在于 assets/images/bg/ 下）
        const bgImages = [
          'assets/images/bg/1.jpg',
          'assets/images/bg/2.jpg',
          'assets/images/bg/3.jpg',
          'assets/images/bg/4.jpg'
        ];
        
        // 随机选一张
        const randomIndex = Math.floor(Math.random() * bgImages.length);
        const selectedImage = bgImages[randomIndex];
        
        // 设置到 body 背景
        document.body.style.backgroundImage = `url('${selectedImage}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundAttachment = 'scroll';
        
        console.log(`📱 移动端随机背景已应用：第 ${randomIndex + 1} 张`);
      }

      // ===== 阻止空链接跳转 =====
      document.querySelectorAll('a[href="#"]').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          console.log('链接点击:', link.textContent.trim());
        });
      });
    })();
  </script>
</body>
</html>
